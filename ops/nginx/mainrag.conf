# MAINRAG - Reverse Proxy Configuration
# Frontend: Port 3002 (SvelteKit)
# API: Port 3001 (Rust Axum)

upstream mainrag_frontend {
    server 127.0.0.1:3002;
    keepalive 32;
}

upstream mainrag_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 8088;
    server_name localhost mainrag.local;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API endpoints - most specific first
    location /api/ {
        proxy_pass http://mainrag_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # Health check (API)
    location = /health {
        proxy_pass http://mainrag_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # Metrics endpoint (API)
    location = /metrics {
        proxy_pass http://mainrag_api/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    # Static assets caching (SvelteKit)
    location ~* ^/_app/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://mainrag_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend (SvelteKit) - catch-all for everything else
    location / {
        proxy_pass http://mainrag_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
