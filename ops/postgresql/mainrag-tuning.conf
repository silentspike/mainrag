# ===================================================================
# MAINRAG PostgreSQL 18 Tuning Configuration
# ===================================================================
# Hardware: Ryzen 9 5900HS (8C/16T), 14GB RAM, NVMe SSD
# Workload: pgvector HNSW, Full-Text Search, 10-20 concurrent agents
# Updated: 2025-12-13 (basierend auf Performance-Analyse)
# ===================================================================

# ---------------------------------------------------------------------
# Memory Settings (14GB Total RAM, ~4GB for Postgres)
# ---------------------------------------------------------------------
# 25-30% of RAM for shared buffers
shared_buffers = 4GB

# 75% of RAM for OS cache estimate
effective_cache_size = 12GB

# Per-operation memory - REDUCED to prevent swap pressure
# Old: 64MB -> 64MB * 50 connections = 3.2GB potential
# New: 32MB -> 32MB * 50 connections = 1.6GB potential
work_mem = 32MB

# Maintenance operations (VACUUM, CREATE INDEX, REINDEX)
maintenance_work_mem = 1GB

# Connection limit - use connection pooling (Deadpool in API)
max_connections = 50

# Huge pages - reduces TLB misses (requires kernel config: vm.nr_hugepages=2300)
huge_pages = try

# ---------------------------------------------------------------------
# WAL Settings (NVMe optimized, reduced checkpoint frequency)
# ---------------------------------------------------------------------
# Checkpoint every 15 min or 8GB whichever comes first
checkpoint_timeout = 15min
max_wal_size = 8GB
min_wal_size = 1GB

# WAL buffers - increased for write-heavy workloads
wal_buffers = 64MB

# Compress WAL with lz4 (faster than pglz/zstd, good balance)
wal_compression = lz4

# Spread checkpoint over 90% of interval
checkpoint_completion_target = 0.9

# WAL writer tuning
wal_writer_delay = 20ms

# ---------------------------------------------------------------------
# I/O Concurrency (NVMe optimized)
# ---------------------------------------------------------------------
# Cost estimation for random vs sequential I/O (NVMe is fast)
random_page_cost = 1.1
seq_page_cost = 1.0

# Concurrent I/O requests for queries
effective_io_concurrency = 200

# Concurrent I/O for maintenance (VACUUM, CREATE INDEX)
# INCREASED from 16 to fully utilize NVMe capabilities
maintenance_io_concurrency = 200

# PostgreSQL 18 Async I/O - io_uring available (liburing linked)
# ~3x faster seq scans on NVMe vs sync mode
io_method = io_uring

# ---------------------------------------------------------------------
# Parallel Query Settings (16 Threads available)
# ---------------------------------------------------------------------
# Workers per query gather node
max_parallel_workers_per_gather = 4

# Total parallel workers for queries
max_parallel_workers = 12

# Total background workers (parallel + maintenance + replication)
max_worker_processes = 16

# Allow leader to participate in parallel scans
parallel_leader_participation = on

# Parallel maintenance (VACUUM, CREATE INDEX)
max_parallel_maintenance_workers = 4

# ---------------------------------------------------------------------
# pgvector HNSW Settings
# ---------------------------------------------------------------------
# Higher ef_search = better recall, slower search
# Default: 40, we use 100 for better accuracy on 768-dim BGE vectors
# Apply per-session or per-database:
# SET hnsw.ef_search = 100;

# ---------------------------------------------------------------------
# Observability & Diagnostics
# ---------------------------------------------------------------------
# Query statistics extension (CRITICAL for performance tuning)
shared_preload_libraries = 'pg_stat_statements'

# Track I/O timing for accurate latency metrics
track_io_timing = on

# Track function call statistics
track_functions = all

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB

# Log queries > 500ms
log_min_duration_statement = 500

# Log checkpoints and lock waits
log_checkpoints = on
log_lock_waits = on

# Log ALL autovacuum runs for transparency (set to 1000 if too verbose)
log_autovacuum_min_duration = 0

# Log temp files > 10MB (detect spilling sorts/hashes)
log_temp_files = 10MB

# ---------------------------------------------------------------------
# Safety Limits
# ---------------------------------------------------------------------
# Prevent runaway temp file usage
temp_file_limit = 20GB

# Statement timeout (prevents infinite queries)
statement_timeout = 30s

# Deadlock detection timeout
deadlock_timeout = 1s

# ---------------------------------------------------------------------
# Autovacuum (aggressive for high-churn tables)
# ---------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s

# Trigger vacuum when 5% of rows changed
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.05

# Trigger analyze when 2% of rows changed
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.02

# Allow more aggressive I/O for vacuum
autovacuum_vacuum_cost_limit = 2000

# ---------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------
password_encryption = scram-sha-256
ssl = off  # Enable in production with certs

# ---------------------------------------------------------------------
# Application-Level Settings (run as superuser)
# ---------------------------------------------------------------------
# -- Create pg_stat_statements extension
# CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
#
# -- Set default HNSW search parameters for mainrag database
# ALTER DATABASE mainrag SET hnsw.ef_search = 100;
#
# -- Optimize for JSONB operations
# ALTER DATABASE mainrag SET enable_hashjoin = on;
