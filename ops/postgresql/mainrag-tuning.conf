# ---------------------------------------------------------------------
# Kernel Settings (run as root)
# ---------------------------------------------------------------------
# # Enable huge pages (calculate: shared_buffers / 2MB + buffer)
# # For 4GB shared_buffers: 4096/2 + 100 = 2148, round up to 2300
# echo 'vm.nr_hugepages = 2300' >> /etc/sysctl.d/99-postgres.conf
# sysctl -p /etc/sysctl.d/99-postgres.conf
#
# # Then set huge_pages = on (instead of try)
