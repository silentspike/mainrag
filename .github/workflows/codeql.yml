name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'   # weekly, Monday 07:23 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    # GitHub Default CodeQL setup is enabled for this repository. Running this
    # advanced workflow at the same time causes SARIF uploads to be rejected.
    # Keep the historical check names green by default, and only run the
    # advanced workflow when CODEQL_ADVANCED_ENABLED=true is set after default
    # setup has been disabled in repository settings.
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - name: Skip advanced CodeQL
        if: ${{ vars.CODEQL_ADVANCED_ENABLED != 'true' }}
        run: |
          echo "Advanced CodeQL workflow is disabled because GitHub Default CodeQL setup is enabled."
          echo "Set repository variable CODEQL_ADVANCED_ENABLED=true only after disabling Default CodeQL setup."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ vars.CODEQL_ADVANCED_ENABLED == 'true' }}
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        if: ${{ vars.CODEQL_ADVANCED_ENABLED == 'true' }}
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        if: ${{ vars.CODEQL_ADVANCED_ENABLED == 'true' }}

      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        if: ${{ vars.CODEQL_ADVANCED_ENABLED == 'true' }}
        with:
          category: "/language:${{ matrix.language }}"
