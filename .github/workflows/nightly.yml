name: Nightly

on:
  schedule:
    - cron: '17 4 * * *'   # 04:17 UTC, once per day
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: cargo test (unit, no service deps)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Stage BGE tokenizer asset for chunker tests
        # Several `services::chunker::semantic::tests` and the gemini jsonl
        # test load /data/models/bge-base-en-v1.5/tokenizer.json at runtime.
        # Download it (~400 KB) so the tests run for real on CI. Closes #7.
        run: |
          sudo mkdir -p /data/models/bge-base-en-v1.5
          sudo chown -R "$USER:$USER" /data/models
          curl -sSL --fail-with-body \
            https://huggingface.co/BAAI/bge-base-en-v1.5/resolve/a5beb1e3e68b9ab74eb54cfd186867f64f240e1a/tokenizer.json \
            -o /data/models/bge-base-en-v1.5/tokenizer.json
          echo "d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66  /data/models/bge-base-en-v1.5/tokenizer.json" \
            | sha256sum --check --strict
          ls -la /data/models/bge-base-en-v1.5/tokenizer.json
      - name: Run workspace unit tests
        run: cargo test --workspace --no-default-features --lib -- --nocapture

  docs:
    name: cargo doc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --workspace --no-deps

  audit:
    name: cargo audit (RUSTSEC advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No continue-on-error: the job must stay green. audit.toml at the repo
    # root documents the exact unmaintained-crate advisories we accept (see
    # issue #8) and `cargo audit` reads it automatically.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
