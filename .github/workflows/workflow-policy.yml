name: Workflow policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workflow-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: workflow-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate issue forms
        run: python3 .github/scripts/check_issue_forms.py
      - name: Test issue-contract validator
        run: node --test .github/scripts/validate-pr-contract.test.cjs
      - name: Validate workflow policy
        run: python3 .github/scripts/check_workflows.py
      - name: Parse YAML files
        run: |
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path) }' \
            .github/ISSUE_TEMPLATE/*.yml .github/workflows/*.yml
