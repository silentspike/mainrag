name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # tree-sitter grammars need a C toolchain; runners already ship it.
      # Deny only the correctness group — style/complexity/pedantic groups
      # report as warnings so we keep the signal without blocking the green bar.
      - run: |
          cargo clippy --workspace --no-deps --all-targets -- \
            -D clippy::correctness \
            -W clippy::suspicious \
            -A clippy::style \
            -A clippy::complexity \
            -A clippy::perf \
            -A clippy::pedantic \
            -A clippy::nursery

  check:
    name: cargo check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --workspace --all-targets
      - name: Verify CPU backfill route isolation
        shell: bash
        run: |
          cargo test -p mainrag-api --bin mainrag-api backfill_tests -- --nocapture | tee backfill-tests.log
          python3 -c 'from pathlib import Path; assert "2 passed; 0 failed;" in Path("backfill-tests.log").read_text(), "Expected both backfill regression tests to execute"'
      - name: Verify chunk probe reuse
        shell: bash
        run: |
          cargo test -p mainrag-api --lib chunk_reuse_tests -- --nocapture | tee chunk-reuse-tests.log
          python3 -c 'from pathlib import Path; assert "4 passed; 0 failed; 1 ignored;" in Path("chunk-reuse-tests.log").read_text(), "Expected all four chunk reuse regressions and the opt-in benchmark"'

  docs-links:
    name: docs link sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test telemetry integrity presentation
        run: node --test eval/storage_v2/telemetry_viewer.test.cjs
      - name: Verify every relative link in README resolves
        run: |
          python3 - <<'PY'
          import re, sys, os
          content = open('README.md').read()
          links = re.findall(r'\]\((?!https?://|#)([^)]+)\)', content)
          missing = [p.split('#')[0].split('?')[0] for p in links
                     if p and not os.path.exists(p.split('#')[0].split('?')[0])]
          if missing:
              print(f"Missing relative paths in README.md: {missing}")
              sys.exit(1)
          print(f"README.md: {len(links)} relative links all resolve")
          PY

  # Integration smoke test — brings up PostgreSQL + Qdrant as service
  # containers and verifies the API can reach them. Does not try to load
  # GTE embeddings (TEI needs a real GPU + model cache), so the API
  # compile/link is verified but the retrieval round-trip is not.
  integration:
    name: integration services smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mainrag_ci
          POSTGRES_USER: mainrag
          POSTGRES_PASSWORD: ci_only_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mainrag -d mainrag_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.16.3
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "bash -c '</dev/tcp/localhost/6333'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify PostgreSQL reachable
        run: |
          PGPASSWORD=ci_only_secret psql -h localhost -U mainrag -d mainrag_ci -c 'SELECT version();'
      - name: Verify Qdrant reachable
        run: |
          curl -sf http://localhost:6333/readyz
          curl -sf http://localhost:6333/collections | python3 -m json.tool

  required:
    name: ci-required
    if: always()
    needs: [fmt, clippy, check, docs-links, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = {
              name: result["result"]
              for name, result in json.loads(os.environ["NEEDS_JSON"]).items()
          }
          print(results)
          failed = {name: result for name, result in results.items() if result != "success"}
          if failed:
              print(f"Required CI jobs did not succeed: {failed}", file=sys.stderr)
              sys.exit(1)
          PY
