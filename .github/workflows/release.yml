name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0-alpha.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build mainrag-cli + mainrag-api (release)
        run: cargo build --release --workspace --bins
      - name: Stage artefacts
        run: |
          mkdir -p dist
          cp target/release/mainrag     dist/mainrag-linux-x86_64
          cp target/release/mainrag-api dist/mainrag-api-linux-x86_64
          (cd dist && sha256sum mainrag-* > SHA256SUMS)
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist/
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" \
            --title "${{ steps.tag.outputs.name }}" \
            --generate-notes \
            dist/*
