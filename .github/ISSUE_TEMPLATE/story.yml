name: Engineering story
description: Define a user-facing or release-facing capability with observable value.
title: "[Story] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use public-safe information only. Do not include credentials, private source content,
        account identities, hostnames, addresses, local paths, or raw private logs.
  - type: textarea
    id: parent_dependencies
    attributes:
      label: Parent and dependencies
      description: Name the parent, blockers, architecture references, target branch, and closure mode.
    validations:
      required: true
  - type: textarea
    id: user_outcome
    attributes:
      label: User outcome
      description: "Use: As a [role], I want [capability], so that [observable benefit]. Include affected platforms."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
    validations:
      required: true
  - type: textarea
    id: current_baseline
    attributes:
      label: Current baseline
      description: Include observable behavior, current code paths, evidence date, and volatile facts to refresh.
    validations:
      required: true
  - type: textarea
    id: desired_outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: in_scope
    attributes:
      label: In scope
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals and non-claims
    validations:
      required: true
  - type: textarea
    id: implementation_boundary
    attributes:
      label: Implementation boundary and reusable paths
      description: Cover producers, transports, persistence, recovery/concurrency, consumers, public surfaces, direct callers, and existing abstractions.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Include positive behavior, rejection/isolation, recovery/race behavior where relevant, platforms, and real evidence needs.
    validations:
      required: true
  - type: textarea
    id: verification_strategy
    attributes:
      label: Verification strategy
      description: Define cheap checks, focused tests, one aggregate gate, real external checks, and zero-test protection.
    validations:
      required: true
  - type: textarea
    id: privacy_evidence_cleanup
    attributes:
      label: Privacy, evidence, and cleanup
      description: Define forbidden data, evidence identity/retention, temporary resources, rollback, and cleanup.
    validations:
      required: true
  - type: textarea
    id: landing_closure_approval
    attributes:
      label: Landing, closure, and approval boundary
      description: Name PR target, Closes/Refs behavior, worker/reviewer/merge authority, and deployment/release exclusions.
    validations:
      required: true
  - type: textarea
    id: stop_conditions
    attributes:
      label: Stop conditions
    validations:
      required: true
