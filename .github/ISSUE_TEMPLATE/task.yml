name: Engineering task
description: Define one concrete implementation, migration, governance, or evidence output.
title: "[Task] "
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use public-safe information only. Do not include credentials, private source content,
        account identities, hostnames, addresses, local paths, or raw private logs.
  - type: textarea
    id: context_dependencies
    attributes:
      label: Context and dependencies
      description: Name parent, blockers, references, target branch, closure mode, owner, and neighboring ownership boundary.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State one concrete output and observable result.
    validations:
      required: true
  - type: textarea
    id: current_baseline
    attributes:
      label: Current baseline
      description: Include current behavior, code paths, evidence date, reusable components, and volatile facts to refresh.
    validations:
      required: true
  - type: textarea
    id: in_scope
    attributes:
      label: In scope
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals and non-claims
    validations:
      required: true
  - type: textarea
    id: implementation_boundary
    attributes:
      label: Implementation boundary and reusable paths
      description: Cover the exact producer-to-consumer path, direct callers, recovery/concurrency, and neighboring systems that must remain unchanged.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Include positive, negative/isolation, retry/recovery where relevant, affected platforms, and observable evidence.
    validations:
      required: true
  - type: textarea
    id: verification_strategy
    attributes:
      label: Verification strategy
      description: Define cheap checks, focused tests, one aggregate gate, external checks if required, and zero-test protection.
    validations:
      required: true
  - type: textarea
    id: privacy_evidence_cleanup
    attributes:
      label: Privacy, evidence, and cleanup
      description: Define forbidden public data, evidence identity/retention, temporary resources, rollback, and cleanup.
    validations:
      required: true
  - type: textarea
    id: landing_closure_approval
    attributes:
      label: Landing, closure, and approval boundary
      description: Name PR target, Closes/Refs behavior, worker/reviewer/merge authority, and deployment/release exclusions.
    validations:
      required: true
  - type: textarea
    id: stop_conditions
    attributes:
      label: Stop conditions
    validations:
      required: true
