[package]
name = "mainrag-api"
description = "MainRag API Server - hybrid retrieval with PostgreSQL + Qdrant + TEI + cross-encoder reranking"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "mainrag_api"
path = "src/lib.rs"

[[bin]]
name = "mainrag-api"
path = "src/main.rs"

[features]
default = []
pdf-mupdf = ["dep:mupdf"]
storage-v2-shadow-ingest = []
storage-v2-intelligence = ["storage-v2-shadow-ingest"]
storage-v2-retrieval = ["storage-v2-intelligence"]

[dependencies]
# Async Runtime
tokio = { version = "1.42", features = ["full"] }

# Web Framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "limit", "set-header", "timeout"] }
http-body-util = "0.1"

# Database
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
deadpool-postgres = "0.14"
postgres-types = { version = "0.2", features = ["derive"] }
pgvector = { version = "0.4", features = ["postgres"] }
rust_decimal = { version = "1.36", features = ["db-tokio-postgres"] }

# PostgreSQL TLS (Sprint 4.1)
tokio-postgres-rustls = "0.13"
rustls = "0.23"
rustls-native-certs = "0.8"

# HTTP Client (for TEI + OCR)
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication
jsonwebtoken = "9.3"
argon2 = "0.5"
bcrypt = "0.16"
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Rate Limiting & Caching
governor = "0.7"
moka = { version = "0.12", features = ["sync"] }

# Utilities
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dotenvy = "0.15"
config = "0.14"
regex = "1.11"
once_cell = "1.20"
url = "2.5"
async-trait = "0.1"
rand = "0.8"
parking_lot = "0.12"

# Index/Ingest Pipeline + Security
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
zstd = "0.13"
async-recursion = "1.1"

# Domain Profiles
toml = "0.8"

# Plugins
git2 = "0.20"
ignore = "0.4"
html-escape = "0.2"
scraper = "0.21"
hex = "0.4"

# PDF Plugin - Fallback (immer verfügbar)
pdf-extract = "0.7"

# PDF Plugin - MuPDF (optional, braucht libmupdf-dev)
mupdf = { version = "0.5", optional = true }

# Code Intelligence (Tree-Sitter)
# NOTE: tree-sitter 0.26 for Language ABI 15 compatibility
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-bash = "0.23"
tree-sitter-md = "0.5"
# Additional languages for CodeRag feature parity (A.6)
tree-sitter-c-sharp = "0.23"
tree-sitter-zig = "1.1"
tree-sitter-lua = "0.4"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-xml = "0.7"
# NOTE: tree-sitter-dockerfile not available for ABI 15 — excluded from parser list
tree-sitter-scheme = "0.24"
# tree-sitter-sequel 0.3.11 uses tree-sitter-language 0.1.6 (ABI 15 bridge) — verified 2026-02-18
tree-sitter-sequel = "0.3"

# Watch Mode (Phase 11)
notify = "6"
notify-debouncer-mini = "0.4"
dashmap = "6"  # Thread-safe HashMap for watch service caches (TODO: migrate to moka)

# Performance (Sprint 5.7)
rustc-hash = "2.1"

# MCP Server (Phase 11)
rmcp = "1.4"
urlencoding = "2.1"

# Semantic Chunking (Phase 12)
tiktoken-rs = "0.6"
# Phase 3.1: HuggingFace tokenizer for BGE model alignment (Feature Flag controlled)
tokenizers = "0.21"

# Process Monitoring (Realtime Dashboard)
sysinfo = "0.31"
async-stream = "0.3"
futures = "0.3"

[dev-dependencies]
# PDF Test Fixture Generation
printpdf = "0.7"
# Benchmarking
criterion = { version = "0.5", features = ["async_tokio"] }
# K3-FIX2: Compile-fail tests for RLS compile-time guard
trybuild = "1"

[[bench]]
name = "query_expansion_bench"
harness = false

# [profile.release] lives in the workspace root Cargo.toml — Cargo ignores
# non-root profiles since 1.84 and emits a warning. Keep profile settings
# centralized there.
