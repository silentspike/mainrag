# MAINRAG TEI Docker Compose
# Only TEI runs in Docker (GPU passthrough via nvidia-container-toolkit)
# PostgreSQL and Qdrant run native via systemd

services:
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.5
    container_name: mainrag-tei
    restart: unless-stopped
    ports:
      - "8080:80"      # REST API
    volumes:
      - /data/models:/data
    environment:
      - LOG_LEVEL=info
      - HF_HUB_ENABLE_HF_TRANSFER=0
    command: ["--model-id", "/data/bge-base-en-v1.5", "--port", "80"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
