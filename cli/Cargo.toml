[package]
name = "mainrag-cli"
description = "CLI for MainRag - hybrid retrieval & context system for code understanding"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "mainrag"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive", "env", "color"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Async runtime
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "fs"] }

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Config
toml = "0.8"
directories = "5.0"

# Output formatting
colored = "3.0"
indicatif = { version = "0.17", features = ["rayon"] }

# Error handling
anyhow = "1.0"

# Password prompt (Sprint 4.5: secure terminal echo masking)
rpassword = "5"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
humansize = "2.1"
url = "2.5"
urlencoding = "2.1"

# Watch Mode (Phase 11)
notify = "6"
notify-debouncer-mini = "0.4"

# [profile.release] lives in the workspace root Cargo.toml — Cargo ignores
# non-root profiles since 1.84 and emits a warning. Keep profile settings
# centralized there.
